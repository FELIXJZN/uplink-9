# Builds the Uplink-9 iPhone + Watch app (the mobile/ folder) on GitHub's Macs, so no Mac is needed.
#
#   ipa         every push that touches mobile/: compiles the app for real iPhones and keeps an
#               unsigned Uplink9.ipa to download (Actions > this run > Artifacts). Install it with
#               Sideloadly from Windows and a free Apple ID (see mobile/README.md).
#   testflight  only when the repository variable TESTFLIGHT is "on": signs in the cloud with your
#               App Store Connect API key and uploads to TestFlight (paid Apple Developer account)
name: iPhone app

on:
  push:
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile

jobs:
  ipa:
    name: Build Uplink9.ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -version
          xcodebuild archive \
            -project Uplink9.xcodeproj -scheme Uplink9 -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Uplink9.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show the errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -50 || true

      - name: Pack the .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Uplink9.xcarchive/Products/Applications/Uplink9.app" "$RUNNER_TEMP/ipa/Payload/"
          ls "$RUNNER_TEMP/ipa/Payload/Uplink9.app/Watch" || echo "no Watch app inside"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/mobile/Uplink9.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/mobile/Uplink9.ipa"

      - name: Check what's inside
        run: |
          APP="$RUNNER_TEMP/ipa/Payload/Uplink9.app"
          echo "::notice title=Build::$(grep -E 'ARCHIVE (SUCCEEDED|FAILED)' build.log | tail -1) · log $(wc -l < build.log) lines · $(grep -c 'warning:' build.log || true) warnings"
          echo "::notice title=iPhone app::$(du -sh "$APP" | cut -f1) · $(lipo -archs "$APP/Uplink9") · version $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")) · $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          if [ -d "$APP/Watch" ]; then
            W=$(ls -d "$APP"/Watch/*.app | head -1)
            echo "::notice title=Watch app::$(basename "$W") · $(du -sh "$W" | cut -f1) · $(lipo -archs "$W/$(basename "$W" .app)")"
          else
            echo "::warning title=Watch app::not inside the iPhone app"
          fi
          echo "::notice title=File::Uplink9.ipa $(du -h "$GITHUB_WORKSPACE/mobile/Uplink9.ipa" | cut -f1)"
          grep -E 'warning:' build.log | grep -v 'appintentsmetadataprocessor' | sed -E 's/.*warning: //' | sort -u | head -8 | while read -r w; do echo "::warning title=Compiler::$w"; done

      - name: Keep the .ipa
        uses: actions/upload-artifact@v5
        with:
          name: Uplink9-ipa
          path: mobile/Uplink9.ipa

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: mobile/build.log

  testflight:
    name: Upload to TestFlight
    needs: ipa
    if: ${{ vars.TESTFLIGHT == 'on' }}
    runs-on: macos-15
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the settings
        run: |
          missing=""
          [ -n "$BUNDLE_ID" ] || missing="$missing BUNDLE_ID(variable)"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing in GitHub settings:$missing (see README)"; exit 1; fi

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive (signed in the cloud)
        run: |
          xcodebuild archive \
            -project Uplink9.xcodeproj -scheme Uplink9 -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Uplink9.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            UPLINK_BUNDLE_ID="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Uplink9.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It shows up in TestFlight after Apple finishes processing (10–30 minutes)."
