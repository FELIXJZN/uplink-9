# XcodeGen project definition. The GitHub build turns this into Uplink9.xcodeproj,
# so the project file never needs to be edited by hand (or on a Mac).
name: Uplink9

options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    # Change this to your own reverse-domain ID before the first TestFlight upload,
    # or set the BUNDLE_ID variable in GitHub (see README).
    UPLINK_BUNDLE_ID: com.example.uplink9
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.11"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES

targets:
  Uplink9:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Uplink-9
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # uplink9://pair?... links from the handheld's pairing QR code open the app
        CFBundleURLTypes:
          - CFBundleURLName: $(UPLINK_BUNDLE_ID).pair
            CFBundleURLSchemes: [uplink9]
        # The handheld speaks plain HTTP on its Tailscale or home IP address
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Uplink-9 talks to your handheld and checks your nodes on the local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UPLINK_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      # Xcode's "Embed Watch Content" phase: the Watch app goes inside the iPhone app
      - target: Uplink9Watch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  Uplink9Watch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Uplink-9
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(UPLINK_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UPLINK_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Uplink9:
    build:
      targets:
        Uplink9: all
    run:
      config: Debug
    archive:
      config: Release
