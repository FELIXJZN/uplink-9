[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uplink-9"
dynamic = ["version"]
description = "Retro green-phosphor terminal OS for handheld Linux devices"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
dependencies = []

[project.optional-dependencies]
gui = ["pygame>=2.1"]

[project.scripts]
uplink = "uplink.__main__:main"

[tool.setuptools]
packages = ["uplink"]

[tool.setuptools.dynamic]
version = { attr = "uplink.__version__" }
